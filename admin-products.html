<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Management - FortuneHub Admin</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .header h1 {
            color: #667eea;
            font-size: 28px;
        }

        .stats {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 25px;
            border-radius: 10px;
            text-align: center;
        }

        .stat-card .number {
            font-size: 24px;
            font-weight: bold;
        }

        .stat-card .label {
            font-size: 12px;
            opacity: 0.9;
        }

        .controls {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            margin-bottom: 30px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-danger {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }

        .btn-success {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
        }

        .search-box {
            flex: 1;
            min-width: 250px;
        }

        .search-box input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s;
        }

        .search-box input:focus {
            outline: none;
            border-color: #667eea;
        }

        .filter-select {
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            background: white;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
            margin-bottom: 30px;
        }

        .product-card {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            transition: all 0.3s;
            position: relative;
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.15);
        }

        .product-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background: #f5f5f5;
        }

        .product-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
            color: white;
            text-transform: uppercase;
        }

        .badge-new {
            background: #4facfe;
        }

        .badge-sale {
            background: #f5576c;
        }

        .badge-featured {
            background: #ffd700;
            color: #333;
        }

        .product-info {
            padding: 20px;
        }

        .product-name {
            font-size: 16px;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .product-category {
            font-size: 12px;
            color: #667eea;
            text-transform: uppercase;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .product-description {
            font-size: 13px;
            color: #666;
            margin-bottom: 12px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .product-price {
            font-size: 20px;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 15px;
        }

        .product-status {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            font-size: 12px;
        }

        .status-badge {
            padding: 4px 10px;
            border-radius: 12px;
            font-weight: 600;
        }

        .status-stock {
            background: #e8f5e9;
            color: #4caf50;
        }

        .status-out {
            background: #ffebee;
            color: #f44336;
        }

        .status-sold {
            background: #fff3e0;
            color: #ff9800;
        }

        .product-actions {
            display: flex;
            gap: 8px;
        }

        .product-actions button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.3s;
        }

        .btn-edit {
            background: #4facfe;
            color: white;
        }

        .btn-delete {
            background: #f5576c;
            color: white;
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 1000;
            overflow-y: auto;
            padding: 20px;
        }

        .modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: white;
            border-radius: 15px;
            padding: 30px;
            max-width: 600px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .modal-header h2 {
            color: #667eea;
            font-size: 24px;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 28px;
            cursor: pointer;
            color: #999;
            padding: 0;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .close-btn:hover {
            color: #333;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            transition: all 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }

        .image-upload-area {
            border: 3px dashed #e0e0e0;
            border-radius: 8px;
            padding: 30px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            background: #f9f9f9;
        }

        .image-upload-area:hover {
            border-color: #667eea;
            background: #f5f7ff;
        }

        .image-upload-area.dragover {
            border-color: #667eea;
            background: #f5f7ff;
        }

        .upload-icon {
            font-size: 48px;
            color: #667eea;
            margin-bottom: 10px;
        }

        .image-preview {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 15px;
        }

        .preview-item {
            position: relative;
            width: 100px;
            height: 100px;
            border-radius: 8px;
            overflow: hidden;
            border: 2px solid #e0e0e0;
        }

        .preview-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .preview-remove {
            position: absolute;
            top: 5px;
            right: 5px;
            background: #f5576c;
            color: white;
            border: none;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .checkbox-group input[type="checkbox"] {
            width: auto;
            cursor: pointer;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: white;
            font-size: 18px;
        }

        .empty-state {
            background: white;
            border-radius: 15px;
            padding: 60px 20px;
            text-align: center;
        }

        .empty-state-icon {
            font-size: 64px;
            color: #e0e0e0;
            margin-bottom: 20px;
        }

        .empty-state h3 {
            color: #333;
            margin-bottom: 10px;
        }

        .empty-state p {
            color: #666;
            margin-bottom: 20px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                align-items: stretch;
            }

            .header h1 {
                font-size: 22px;
            }

            .stats {
                justify-content: space-between;
            }

            .controls {
                flex-direction: column;
                align-items: stretch;
            }

            .btn {
                width: 100%;
                justify-content: center;
            }

            .products-grid {
                grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            }

            .modal-content {
                padding: 20px;
            }
        }

        @media (max-width: 480px) {
            .products-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📦 Product Management</h1>
            <div class="stats">
                <div class="stat-card">
                    <div class="number" id="totalProducts">0</div>
                    <div class="label">Total Products</div>
                </div>
                <div class="stat-card">
                    <div class="number" id="totalOrders">0</div>
                    <div class="label">Total Orders</div>
                </div>
            </div>
        </div>

        <div class="controls">
            <button class="btn btn-primary" onclick="openAddModal()">
                ➕ Add New Product
            </button>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="🔍 Search products..." onkeyup="filterProducts()">
            </div>
            <select class="filter-select" id="categoryFilter" onchange="filterProducts()">
                <option value="all">All Categories</option>
                <option value="phones">Phones</option>
                <option value="accessories">Accessories</option>
                <option value="laptops">Laptops</option>
                <option value="tablets">Tablets</option>
                <option value="wearables">Wearables</option>
                <option value="audio">Audio</option>
                <option value="other">Other</option>
            </select>
            <button class="btn btn-success" onclick="loadProducts()">
                🔄 Refresh
            </button>
        </div>

        <div id="productsContainer">
            <div class="loading">Loading products...</div>
        </div>
    </div>

    <!-- Add/Edit Product Modal -->
    <div id="productModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Add New Product</h2>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            <form id="productForm" enctype="multipart/form-data">
                <input type="hidden" id="productId">

                <div class="form-group">
                    <label for="productName">Product Name *</label>
                    <input type="text" id="productName" required placeholder="e.g., iPhone 14 Pro Max">
                </div>

                <div class="form-group">
                    <label for="productPrice">Price (in kobo) *</label>
                    <input type="number" id="productPrice" required placeholder="e.g., 59999000 (₦599,990.00)" min="0">
                    <small style="color: #666; font-size: 12px; display: block; margin-top: 5px;">
                        Enter price in kobo (1 Naira = 100 kobo). Example: ₦5,999 = 599900 kobo
                    </small>
                </div>

                <div class="form-group">
                    <label for="productCategory">Category *</label>
                    <select id="productCategory" required>
                        <option value="">Select Category</option>
                        <option value="phones">Phones</option>
                        <option value="accessories">Accessories</option>
                        <option value="laptops">Laptops</option>
                        <option value="tablets">Tablets</option>
                        <option value="wearables">Wearables</option>
                        <option value="audio">Audio</option>
                        <option value="other">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="productDescription">Description *</label>
                    <textarea id="productDescription" required placeholder="Describe the product features..."></textarea>
                </div>

                <div class="form-group">
                    <label for="productTag">Tag</label>
                    <select id="productTag">
                        <option value="none">None</option>
                        <option value="new">New</option>
                        <option value="sale">Sale</option>
                        <option value="featured">Featured</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Product Images * (Max 5 images)</label>
                    <div class="image-upload-area" id="uploadArea" onclick="document.getElementById('imageInput').click()">
                        <div class="upload-icon">📸</div>
                        <p><strong>Click to upload</strong> or drag and drop</p>
                        <p style="font-size: 12px; color: #999; margin-top: 5px;">JPG, PNG, GIF, WEBP (Max 5MB each)</p>
                    </div>
                    <input type="file" id="imageInput" accept="image/*" multiple style="display: none;" onchange="handleImageSelect(event)">
                    <div id="imagePreview" class="image-preview"></div>
                </div>

                <div class="form-group">
                    <div class="checkbox-group">
                        <input type="checkbox" id="outOfStock">
                        <label for="outOfStock" style="margin: 0; font-weight: normal;">Mark as Out of Stock</label>
                    </div>
                </div>

                <div class="form-group">
                    <div class="checkbox-group">
                        <input type="checkbox" id="sold">
                        <label for="sold" style="margin: 0; font-weight: normal;">Mark as Sold</label>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%;">
                    💾 Save Product
                </button>
            </form>
        </div>
    </div>

    <script>
        // Configuration
        const API_BASE_URL = 'http://localhost:5000/api'; // Change this to your deployed backend URL
        let allProducts = [];
        let selectedFiles = [];

        // Load products on page load
        document.addEventListener('DOMContentLoaded', () => {
            loadProducts();
            loadStats();
            setupDragAndDrop();
        });

        // Load all products
        async function loadProducts() {
            try {
                const response = await fetch(`${API_BASE_URL}/products`);
                if (!response.ok) throw new Error('Failed to fetch products');
                
                allProducts = await response.json();
                displayProducts(allProducts);
            } catch (error) {
                console.error('Error loading products:', error);
                document.getElementById('productsContainer').innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">❌</div>
                        <h3>Error Loading Products</h3>
                        <p>${error.message}</p>
                        <button class="btn btn-primary" onclick="loadProducts()">Try Again</button>
                    </div>
                `;
            }
        }

        // Display products
        function displayProducts(products) {
            const container = document.getElementById('productsContainer');
            
            if (products.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📦</div>
                        <h3>No Products Found</h3>
                        <p>Start by adding your first product!</p>
                        <button class="btn btn-primary" onclick="openAddModal()">➕ Add Product</button>
                    </div>
                `;
                return;
            }

            container.innerHTML = `
                <div class="products-grid">
                    ${products.map(product => `
                        <div class="product-card">
                            ${product.tag && product.tag !== 'none' ? `
                                <span class="product-badge badge-${product.tag}">${product.tag}</span>
                            ` : ''}
                            <img src="${API_BASE_URL.replace('/api', '')}${product.image}" 
                                 alt="${product.name}" 
                                 class="product-image"
                                 onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22200%22 height=%22200%22%3E%3Crect fill=%22%23f0f0f0%22 width=%22200%22 height=%22200%22/%3E%3Ctext x=%2250%25%22 y=%2250%25%22 dominant-baseline=%22middle%22 text-anchor=%22middle%22 font-family=%22sans-serif%22 font-size=%2220%22 fill=%22%23999%22%3ENo Image%3C/text%3E%3C/svg%3E'">
                            <div class="product-info">
                                <div class="product-category">${product.category}</div>
                                <div class="product-name">${product.name}</div>
                                <div class="product-description">${product.description}</div>
                                <div class="product-price">₦${(product.price / 100).toLocaleString()}</div>
                                <div class="product-status">
                                    ${product.outOfStock ? 
                                        '<span class="status-badge status-out">Out of Stock</span>' : 
                                        '<span class="status-badge status-stock">In Stock</span>'}
                                    ${product.sold ? '<span class="status-badge status-sold">Sold</span>' : ''}
                                </div>
                                <div class="product-actions">
                                    <button class="btn-edit" onclick="editProduct('${product._id}')">✏️ Edit</button>
                                    <button class="btn-delete" onclick="deleteProduct('${product._id}', '${product.name}')">🗑️ Delete</button>
                                </div>
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        // Load stats
        async function loadStats() {
            try {
                const response = await fetch(`${API_BASE_URL}/stats`);
                const stats = await response.json();
                
                document.getElementById('totalProducts').textContent = stats.totalProducts || 0;
                document.getElementById('totalOrders').textContent = stats.totalOrders || 0;
            } catch (error) {
                console.error('Error loading stats:', error);
            }
        }

        // Filter products
        function filterProducts() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const category = document.getElementById('categoryFilter').value;

            let filtered = allProducts;

            if (category !== 'all') {
                filtered = filtered.filter(p => p.category === category);
            }

            if (searchTerm) {
                filtered = filtered.filter(p => 
                    p.name.toLowerCase().includes(searchTerm) ||
                    p.description.toLowerCase().includes(searchTerm)
                );
            }

            displayProducts(filtered);
        }

        // Open add modal
        function openAddModal() {
            document.getElementById('modalTitle').textContent = 'Add New Product';
            document.getElementById('productForm').reset();
            document.getElementById('productId').value = '';
            selectedFiles = [];
            document.getElementById('imagePreview').innerHTML = '';
            document.getElementById('productModal').classList.add('active');
        }

        // Edit product
        async function editProduct(id) {
            try {
                const response = await fetch(`${API_BASE_URL}/products/${id}`);
                const product = await response.json();

                document.getElementById('modalTitle').textContent = 'Edit Product';
                document.getElementById('productId').value = product._id;
                document.getElementById('productName').value = product.name;
                document.getElementById('productPrice').value = product.price;
                document.getElementById('productCategory').value = product.category;
                document.getElementById('productDescription').value = product.description;
                document.getElementById('productTag').value = product.tag || 'none';
                document.getElementById('outOfStock').checked = product.outOfStock;
                document.getElementById('sold').checked = product.sold;

                // Show existing images
                const preview = document.getElementById('imagePreview');
                preview.innerHTML = product.images.map(img => `
                    <div class="preview-item">
                        <img src="${API_BASE_URL.replace('/api', '')}${img}" alt="Product image">
                    </div>
                `).join('');

                selectedFiles = [];
                document.getElementById('productModal').classList.add('active');
            } catch (error) {
                alert('Error loading product: ' + error.message);
            }
        }

        // Delete product
        async function deleteProduct(id, name) {
            if (!confirm(`Are you sure you want to delete "${name}"?`)) return;

            try {
                const response = await fetch(`${API_BASE_URL}/products/${id}`, {
                    method: 'DELETE'
                });

                if (!response.ok) throw new Error('Failed to delete product');

                alert('Product deleted successfully!');
                loadProducts();
                loadStats();
            } catch (error) {
                alert('Error deleting product: ' + error.message);
            }
        }

        // Handle form submit
        document.getElementById('productForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const productId = document.getElementById('productId').value;
            const formData = new FormData();

            formData.append('name', document.getElementById('productName').value);
            formData.append('price', document.getElementById('productPrice').value);
            formData.append('category', document.getElementById('productCategory').value);
            formData.append('description', document.getElementById('productDescription').value);
            formData.append('tag', document.getElementById('productTag').value);
            formData.append('outOfStock', document.getElementById('outOfStock').checked);
            formData.append('sold', document.getElementById('sold').checked);

            // Add images
            if (selectedFiles.length > 0) {
                selectedFiles.forEach(file => {
                    formData.append('images', file);
                });
            } else if (!productId) {
                alert('Please select at least one product image!');
                return;
            }

            try {
                const url = productId ? 
                    `${API_BASE_URL}/products/${productId}` : 
                    `${API_BASE_URL}/products`;
                
                const method = productId ? 'PUT' : 'POST';

                const response = await fetch(url, {
                    method: method,
                    body: formData
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.error || 'Failed to save product');
                }

                alert(`Product ${productId ? 'updated' : 'created'} successfully!`);
                closeModal();
                loadProducts();
                loadStats();
            } catch (error) {
                alert('Error saving product: ' + error.message);
            }
        });

        // Handle image selection
        function handleImageSelect(event) {
            const files = Array.from(event.target.files);
            
            if (selectedFiles.length + files.length > 5) {
                alert('Maximum 5 images allowed!');
                return;
            }

            files.forEach(file => {
                if (file.size > 5 * 1024 * 1024) {
                    alert(`${file.name} is too large. Max size is 5MB.`);
                    return;
                }

                selectedFiles.push(file);
                
                const reader = new FileReader();
                reader.onload = (e) => {
                    const preview = document.getElementById('imagePreview');
                    const div = document.createElement('div');
                    div.className = 'preview-item';
                    div.innerHTML = `
                        <img src="${e.target.result}" alt="Preview">
                        <button type="button" class="preview-remove" onclick="removeImage(${selectedFiles.length - 1})">×</button>
                    `;
                    preview.appendChild(div);
                };
                reader.readAsDataURL(file);
            });
        }

        // Remove image from selection
        function removeImage(index) {
            selectedFiles.splice(index, 1);
            const preview = document.getElementById('imagePreview');
            preview.children[index].remove();
        }

        // Setup drag and drop
        function setupDragAndDrop() {
            const uploadArea = document.getElementById('uploadArea');

            ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
                uploadArea.addEventListener(eventName, preventDefaults, false);
            });

            function preventDefaults(e) {
                e.preventDefault();
                e.stopPropagation();
            }

            ['dragenter', 'dragover'].forEach(eventName => {
                uploadArea.addEventListener(eventName, () => {
                    uploadArea.classList.add('dragover');
                });
            });

            ['dragleave', 'drop'].forEach(eventName => {
                uploadArea.addEventListener(eventName, () => {
                    uploadArea.classList.remove('dragover');
                });
            });

            uploadArea.addEventListener('drop', (e) => {
                const dt = e.dataTransfer;
                const files = dt.files;
                document.getElementById('imageInput').files = files;
                handleImageSelect({ target: { files: files } });
            });
        }

        // Close modal
        function closeModal() {
            document.getElementById('productModal').classList.remove('active');
        }

        // Close modal on outside click
        document.getElementById('productModal').addEventListener('click', (e) => {
            if (e.target.id === 'productModal') {
                closeModal();
            }
        });
    </script>
</body>
</html>
